<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvel 完全視聴チェックリスト</title>
<style>
:root { color-scheme: dark; --bg:#0b0e14; --panel:#151a24; --line:#2b3445; --text:#f2f5fb; --muted:#a9b4c7; --accent:#d71f35; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(160deg,#101827,var(--bg) 50%); color:var(--text); }
main { max-width:900px; margin:auto; padding:24px 16px 60px; }
header { padding:24px 0 16px; }
.kicker { color:#ff6575; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
h1 { font-size:clamp(1.8rem,5vw,3rem); margin:.3em 0; }
p { color:var(--muted); line-height:1.6; }
.stats { background:var(--panel); border:1px solid var(--line); padding:18px; border-radius:16px; position:sticky; top:8px; z-index:5; box-shadow:0 8px 24px #0005; }
.statline { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
#count { font-weight:800; font-size:1.1rem; }
progress { width:100%; height:10px; margin:12px 0 4px; accent-color:var(--accent); }
.controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
button { cursor:pointer; border:1px solid var(--line); border-radius:10px; padding:9px 12px; color:var(--text); background:#222a39; font:inherit; }
button:hover { background:#303b4f; }
section { margin-top:24px; }
h2 { font-size:1.15rem; margin:0 0 10px; }
.section-count { color:var(--muted); font-size:.85rem; font-weight:500; }
.list { border:1px solid var(--line); background:var(--panel); border-radius:14px; overflow:hidden; }
label.item { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-bottom:1px solid #252d3b; cursor:pointer; line-height:1.45; }
label.item:last-child { border-bottom:0; }
label.item:hover { background:#1c2330; }
input[type=checkbox] { accent-color:var(--accent); width:18px; height:18px; flex:0 0 auto; margin-top:2px; }
.item.done span { color:#8591a5; text-decoration:line-through; }
.num { color:#ff7b89; font-variant-numeric:tabular-nums; min-width:2.4em; display:inline-block; }
.hidden { display:none !important; }
footer { margin-top:30px; color:var(--muted); font-size:.85rem; }
@media(max-width:540px) { main {padding:16px 10px 40px} .stats {top:4px;padding:14px} label.item {padding:11px 10px} }
</style>
</head>
<body>
<main>
<header>
<div class="kicker">Your Marvel Journey</div>
<h1>Marvel 完全視聴チェックリスト</h1>
<p>MCU・Disney+・Sony系・X-Men・Fantastic Four・Marvelドラマなどの視聴進捗を管理。チェックはこのブラウザに自動保存されます。</p>
</header>
<div class="stats">
  <div class="statline"><strong id="count">0 / 121 項目</strong><span id="percent">0% 完了</span></div>
  <progress id="progress" value="0" max="121"></progress>
  <div class="controls">
    <button id="toggleRemaining">未視聴だけ表示</button>
    <button id="export">進捗をバックアップ</button>
    <button id="importBtn">バックアップを読み込む</button>
    <button id="reset">チェックをリセット</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
  <p id="notice" aria-live="polite" style="margin:10px 0 0;font-size:.85rem"></p>
</div>
<div id="sections"></div>
<footer>注意：チェック情報は同じブラウザ内に保存されます。別のPC・スマホとの同期には「進捗をバックアップ」でJSONファイルを保存し、別端末で読み込んでください。リストは元の一覧をそのまま収録しており、公開状況・視聴順は必要に応じて見直してください。</footer>
</main>
<script>
const sections = [{"title": "第1部：MCU初期・S.H.I.E.L.D.の時代", "items": ["アイアンマン", "インクレディブル・ハルク", "アイアンマン2", "マイティ・ソー", "キャプテン・アメリカ／ザ・ファースト・アベンジャー", "エージェント・カーター（短編映画）", "アベンジャーズ", "エージェント・オブ・シールド シーズン1", "マイティ・ソー／ダーク・ワールド", "アイアンマン3", "エージェント・オブ・シールド シーズン2", "キャプテン・アメリカ／ウィンター・ソルジャー", "ガーディアンズ・オブ・ギャラクシー", "ガーディアンズ・オブ・ギャラクシー：リミックス", "アベンジャーズ／エイジ・オブ・ウルトロン", "アントマン", "エージェント・カーター シーズン1", "エージェント・カーター シーズン2", "デアデビル シーズン1", "ジェシカ・ジョーンズ シーズン1"]}, {"title": "第2部：シビル・ウォーとスパイダーマンの旧作", "items": ["デアデビル シーズン2", "ルーク・ケイジ シーズン1", "アイアン・フィスト シーズン1", "キャプテン・アメリカ／シビル・ウォー", "エージェント・オブ・シールド シーズン3", "ドクター・ストレンジ", "ブラックパンサー", "スパイダーマン（2002）", "スパイダーマン2", "スパイダーマン3", "アメイジング・スパイダーマン", "アメイジング・スパイダーマン2", "スパイダーマン：ホームカミング", "パニッシャー シーズン1", "ディフェンダーズ", "ジェシカ・ジョーンズ シーズン2", "ルーク・ケイジ シーズン2", "アイアン・フィスト シーズン2", "デアデビル シーズン3"]}, {"title": "第3部：インフィニティ・サーガ後半", "items": ["マイティ・ソー バトルロイヤル", "アベンジャーズ／インフィニティ・ウォー", "アントマン＆ワスプ", "キャプテン・マーベル", "アベンジャーズ／エンドゲーム", "パニッシャー シーズン2", "ジェシカ・ジョーンズ シーズン3", "スパイダーマン：ファー・フロム・ホーム"]}, {"title": "第4部：Sonyの実写スパイダーマン関連作品", "items": ["ヴェノム", "ヴェノム：レット・ゼア・ビー・カーネイジ", "スパイダーマン：ノー・ウェイ・ホーム"]}, {"title": "第5部：マルチバース・サーガ", "items": ["ワンダヴィジョン", "ファルコン＆ウィンター・ソルジャー", "ロキ シーズン1", "ブラック・ウィドウ", "ホワット・イフ...? シーズン1", "シャン・チー／テン・リングスの伝説", "エターナルズ", "ホークアイ", "ムーンナイト", "ドクター・ストレンジ／マルチバース・オブ・マッドネス", "ミズ・マーベル", "ソー：ラブ＆サンダー", "アイ・アム・グルート シーズン1", "シー・ハルク：ザ・アトーニー", "ブラックパンサー／ワカンダ・フォーエバー", "ガーディアンズ・オブ・ギャラクシー ホリデー・スペシャル", "アントマン＆ワスプ：クアントマニア", "ガーディアンズ・オブ・ギャラクシー：VOLUME 3", "シークレット・インベージョン", "ロキ シーズン2", "マーベルズ", "エコー", "ホワット・イフ...? シーズン2", "アイ・アム・グルート シーズン2", "アガサ・オール・アロング", "ホワット・イフ...? シーズン3"]}, {"title": "第6部：X-Men・Fantastic Fourの旧作", "items": ["X-MEN", "X-MEN2", "X-MEN：ファイナル ディシジョン", "ウルヴァリン：X-MEN ZERO", "X-MEN：ファースト・ジェネレーション", "ウルヴァリン：SAMURAI", "X-MEN：フューチャー＆パスト", "デッドプール", "X-MEN：アポカリプス", "ローガン", "デッドプール2", "X-MEN：ダーク・フェニックス", "ファンタスティック・フォー［超能力ユニット］", "ファンタスティック・フォー：銀河の危機", "ファンタスティック・フォー（2015）"]}, {"title": "第7部：Sony系の残り・アニメ版スパイダーマン", "items": ["モービウス", "マダム・ウェブ", "ヴェノム：ザ・ラストダンス", "クレイヴン・ザ・ハンター", "スパイダーマン：スパイダーバース", "スパイダーマン：アクロス・ザ・スパイダーバース"]}, {"title": "第8部：旧Marvelドラマ・関連シリーズ", "items": ["エージェント・オブ・シールド シーズン4", "エージェント・オブ・シールド シーズン5", "エージェント・オブ・シールド シーズン6", "エージェント・オブ・シールド シーズン7", "インヒューマンズ シーズン1", "クローク＆ダガー シーズン1", "クローク＆ダガー シーズン2", "ランナウェイズ シーズン1", "ランナウェイズ シーズン2", "ランナウェイズ シーズン3"]}, {"title": "第9部：MCUの新しい時代", "items": ["キャプテン・アメリカ：ブレイブ・ニュー・ワールド", "デアデビル：ボーン・アゲイン シーズン1", "サンダーボルツ*", "ファンタスティック4：ファースト・ステップ", "アイアンハート", "デアデビル：ボーン・アゲイン シーズン2", "ワンダーマン", "ヴィジョンクエスト"]}, {"title": "第10部：追加で楽しむアニメ・関連作", "items": ["X-MEN（1992年アニメ版）", "X-MEN '97 シーズン1", "X-MEN '97 シーズン2（公開・配信状況を確認して追加）", "スパイダーマン：フレンドリー・ネイバーフッド（アニメ版）", "マーベル・ゾンビーズ", "アベンジャーズ：ドゥームズデイ（公開後に追加）"]}];
const storageKey = 'marvel-watch-checklist-v1';
let checked = new Set();
let onlyRemaining = false;
try { checked = new Set(JSON.parse(localStorage.getItem(storageKey) || '[]')); } catch(e) {}
const total = sections.reduce((n,s)=>n+s.items.length,0);
const root = document.getElementById('sections');
document.getElementById('progress').max = total;
let num = 0;
sections.forEach((section,si) => {
  const sec = document.createElement('section');
  const h = document.createElement('h2');
  h.innerHTML = '';
  h.append(document.createTextNode(section.title + ' '));
  const count = document.createElement('span'); count.className='section-count'; count.id='section-count-'+si;
  h.append(count); sec.append(h);
  const list = document.createElement('div'); list.className='list';
  section.items.forEach((title,ii) => {
    num++;
    const id = 'item-'+num;
    const label = document.createElement('label'); label.className='item'; label.dataset.title=title;
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=checked.has(title); cb.setAttribute('aria-label',title);
    const text = document.createElement('span');
    const n = document.createElement('b'); n.className='num'; n.textContent=String(num)+':';
    text.append(n, document.createTextNode(' '+title));
    label.append(cb,text); list.append(label);
    cb.addEventListener('change',()=>{
      if(cb.checked) checked.add(title); else checked.delete(title);
      save(); label.classList.toggle('done',cb.checked); update();
    });
  });
  sec.append(list); root.append(sec);
});
function save() { localStorage.setItem(storageKey,JSON.stringify([...checked])); }
function update() {
  let n=0, offset=0;
  sections.forEach((s,si)=>{
    let local=0;
    s.items.forEach(title=>{if(checked.has(title)){n++;local++;}});
    const el=document.getElementById('section-count-'+si);
    el.textContent=`(${local}/${s.items.length})`;
  });
  document.querySelectorAll('label.item').forEach(label=>{
    const cb=label.querySelector('input');
    label.classList.toggle('done',cb.checked);
    label.classList.toggle('hidden',onlyRemaining && cb.checked);
  });
  document.getElementById('count').textContent=`${n} / ${total} 項目`;
  document.getElementById('percent').textContent=`${Math.round(n/total*100)}% 完了`;
  document.getElementById('progress').value=n;
  document.querySelectorAll('section').forEach(sec=>{
    const visible=[...sec.querySelectorAll('label.item')].some(l=>!l.classList.contains('hidden'));
    sec.classList.toggle('hidden',onlyRemaining && !visible);
  });
}
document.getElementById('toggleRemaining').addEventListener('click',e=>{
  onlyRemaining=!onlyRemaining;
  e.target.textContent=onlyRemaining?'すべて表示':'未視聴だけ表示';
  update();
});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('すべてのチェックをリセットしますか？')){
    checked.clear(); document.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false); save(); update();
    document.getElementById('notice').textContent='チェックをリセットしました。';
  }
});
document.getElementById('export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({checked:[...checked],savedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='marvel-watch-progress.json'; a.click(); URL.revokeObjectURL(a.href);
  document.getElementById('notice').textContent='進捗バックアップをダウンロードしました。';
});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const obj=JSON.parse(await f.text()); const arr=Array.isArray(obj)?obj:obj.checked;
    if(!Array.isArray(arr)) throw new Error('invalid');
    checked=new Set(arr); document.querySelectorAll('label.item').forEach(label=>{const cb=label.querySelector('input');cb.checked=checked.has(label.dataset.title);});
    save();update();document.getElementById('notice').textContent='バックアップを読み込みました。';
  }catch(err){document.getElementById('notice').textContent='ファイルを読み込めませんでした。';}
  e.target.value='';
});
update();
</script>
</body>
</html>
